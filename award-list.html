<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Award List</title>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf-autotable@3.8.4/dist/jspdf.plugin.autotable.min.js"></script>
  <link rel="stylesheet" href="style.css">
</head>
<body id="award-list-page">

  <!-- Main Side-by-Side Container -->
  <div class="aw-main-container">
    
    <!-- Left Panel (Home, Header, Form, Label) -->
    <div class="aw-left-panel">
      <div class="aw-header-box">
        <a href="index.html" class="aw-btn-home">Home</a>
        <h1 class="aw-title">Award List</h1>
      </div>

      <section class="aw-form-area">
        <div class="aw-field-group">
          <label for="awClassName">Class:</label>
          <select id="awClassName" class="aw-input-control"></select>
        </div>

        <div class="aw-field-group">
          <label for="awSectionName">Section:</label>
          <select id="awSectionName" class="aw-input-control"></select>
        </div>

        <div class="aw-field-group">
          <label for="awAwardDate">Date:</label>
          <input type="date" id="awAwardDate" class="aw-input-control">
        </div>
      </section>

      <div class="aw-list-title">Award list</div>
    </div>

    <!-- Right Panel (Table with Scroll) -->
    <div class="aw-right-panel">
      <div class="monthly-pdf-toolbar">
        <button type="button" class="btn btn-dark monthly-pdf-btn" onclick="downloadAwardPDF()">
          PDF Download
        </button>
      </div>
      <div class="aw-table-wrapper">
        <table class="aw-data-table">
          <thead>
            <tr>
              <th class="col-sno">S.No</th>
              <th class="col-id">I.D</th>
              <th class="col-name">Name</th>
              <th class="col-fname">F/Name</th>
              <th class="col-sig">Signature</th>
              <th class="col-marks">Obt.Marks</th>
            </tr>
          </thead>

          <tbody id="award-table-body">
            <tr>
              <td>1</td>
              <td>2591</td>
              <td>HASNAIN ZAMAN</td>
              <td>HAIDER ZAMAN</td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td>2</td>
              <td>2602</td>
              <td>MUHAMMAD AHSAN ULLAH</td>
              <td>TAJ MUHAMMAD</td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td>3</td>
              <td>2611</td>
              <td>MUHAMMAD IFTIKHAR</td>
              <td>FAZAL KARIM</td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td>4</td>
              <td>2624</td>
              <td>MUHAMMAD MUZAMMIL</td>
              <td>ABDULLAH KHAN</td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td>5</td>
              <td>2747</td>
              <td>MUSSAWIR KHAN</td>
              <td>AMIN KHAN</td>
              <td></td>
              <td></td>
            </tr>
            <tr>
              <td>6</td>
              <td>2834</td>
              <td>MUHAMMAD MUDASIR</td>
              <td>MUHAMMAD USMAN</td>
              <td></td>
              <td></td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>

  <script src="shared-data.js"></script>
  <script>
    const awardTableBody = document.getElementById("award-table-body");
    const awardClassInput = document.getElementById("awClassName");
    const awardSectionInput = document.getElementById("awSectionName");

    function escapeAwardValue(value) {
      return String(value ?? "").replace(/[&<>"']/g, character => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#039;"
      }[character]));
    }

    function renderUploadedAwardSection() {
      const data = loadSharedAttendanceData();
      populateSharedSelectors(data, awardClassInput, awardSectionInput);

      if (!data || !Object.keys(data).length) return;
      const section = findSharedSection(data, awardClassInput.value, awardSectionInput.value);
      setSharedSectionInputs(section, "awClassName", "awSectionName");
      awardTableBody.innerHTML = (data[section] || []).map(student => `
        <tr>
          <td>${escapeAwardValue(student.sno)}</td>
          <td>${escapeAwardValue(student.id)}</td>
          <td>${escapeAwardValue(student.name)}</td>
          <td>${escapeAwardValue(student.father)}</td>
          <td></td>
          <td></td>
        </tr>
      `).join("");
    }

    function downloadAwardPDF() {
      if (!window.jspdf || typeof window.jspdf.jsPDF !== "function") {
        alert("PDF library could not be loaded. Check your internet connection and try again.");
        return;
      }

      const rows = [...awardTableBody.querySelectorAll("tr")].map(row =>
        [...row.querySelectorAll("td")].map(cell => cell.textContent.trim())
      );
      if (!rows.length) {
        alert("There are no students to export.");
        return;
      }

      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({ orientation: "portrait", unit: "mm", format: "a4" });
      const className = awardClassInput.value || "Class";
      const sectionName = awardSectionInput.value || "Section";
      const reportDate = document.getElementById("awAwardDate").value || new Date().toLocaleDateString("en-GB");
      const columnStyles = {
        0: { cellWidth: 11, halign: "center" },
        1: { cellWidth: 16, halign: "center" },
        2: { cellWidth: 47 },
        3: { cellWidth: 47 },
        4: { cellWidth: 42 },
        5: { cellWidth: 27, halign: "center" }
      };
      const rowsPerPage = 20;
      for (let start = 0; start < rows.length; start += rowsPerPage) {
        if (start > 0) pdf.addPage();
        pdf.setFont("helvetica", "bold");
        pdf.setFontSize(15);
        pdf.text("Jamal International Degree College & School System", 105, 10, { align: "center" });
        pdf.setFontSize(13);
        pdf.text("Award List", 105, 17, { align: "center" });
        pdf.setFontSize(10);
        pdf.text(`Date: ${reportDate}`, 15, 31);
        pdf.setFontSize(15);
        pdf.text(`${className}-${sectionName}`, 105, 24, { align: "center" });
        pdf.setFontSize(10);
        pdf.text("Subject: _______________", 195, 31, { align: "right" });
        pdf.autoTable({
          startY: 36,
          margin: { left: 3, right: 3, bottom: 10 },
          head: [["S.No", "I.D", "Name", "F/Name", "Signature", "Obt.Marks"]],
          body: rows.slice(start, start + rowsPerPage),
          theme: "grid",
          styles: {
            font: "helvetica",
            fontSize: 9,
            cellPadding: 2,
            textColor: [0, 0, 0],
            lineColor: [0, 0, 0],
            lineWidth: 0.2,
            valign: "middle"
          },
          headStyles: {
            fillColor: [255, 192, 0],
            textColor: [0, 0, 0],
            fontStyle: "bold",
            halign: "center",
            minCellHeight: 10
          },
          bodyStyles: { minCellHeight: 11.5 },
          columnStyles
        });
      }
      pdf.save(`Award-List-${className}-${sectionName}.pdf`);
    }

    awardClassInput.addEventListener("change", renderUploadedAwardSection);
    awardSectionInput.addEventListener("change", renderUploadedAwardSection);
    renderUploadedAwardSection();
  </script>

</body>
</html>
